<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameplay</title>
    <link rel="icon" type="image/png" href="../Images/INVERT.png">
    <link rel="stylesheet" href="../css-files/index.css">
    <link rel="stylesheet" href="../css-files/game.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/4fc40ea9d1.js" crossorigin="anonymous"></script>
    <script type = "text/javascript" src = "../game.js" defer></script>
    <script type = "text/javascript" src = "../index.js" defer></script>
    
</head>
<body>
    <div id = "cursor-dot" class = "cursor-dot"></div>
    <div id = "cursor-outline"class = "cursor-outline"></div>
    
    <header>
        <hr class = "thick-line">
        <p id = "call-to-action">Think you can survive the switch? Join now to prove it!</p>
        <div class = "register">
            <a style = "opacity: 1;" class = "registration" id = "login-button" href = "login.html">LOGIN</a>
            <a style = "opacity: 1;" class = "registration" id = "signup-button" href = "signup.html">SIGNUP</a>
            <p style = "opacity: 0;" id = "user" class = "user">Username</p>
            <img style = "opacity: 0;" id = "user-profile" class = "user-profile" src = "../Images/profile.jpg">
            <button style = "opacity: 0;"  id = "log-out" class = "log-out">
                <img src = "../Images/down.png">
            </button>
            <div id = "logout-dropdown" class ="logout-dropdown">
                <button class="logout-dropdown-button" id="logout-dropdown-button" style = "opacity: 0;">Log Out</button>
            </div>
        </div>
        <h1>GAME<span class = "letters">PLAY</span></h1>

    </header>

    
    <nav class = "navigation">  
        <div class = "upper">
            <hr class = "thin-line">
            <div class = "logo">
                <img src = "../Images/INVERT.png">
            </div>
        </div>
        
        <div class = "links" style = "--items: 3;">
            <a class = "page-navigation" href="index.html">HOME</a>   
            <a class = "page-navigation" href="game.html">GAME</a>  
            <a class = "page-navigation" href="leaderboard.html" style = "border-right: none;">LEADERBOARD</a>
            <span class="line"></span>
        </div>  
        
        
    </nav>
    
    <main>
        <div class = "game-border">
            <div class = "main-game">
                <div id = "score" class = "score">SCORE: 0</div>
                <canvas></canvas>
                
                <div id = "game-start-screen" class = "game-start-screen">
                    <button id = "play-easy" class = "play-easy">EASY</button>
                    <button id = "play-normal" class = "play-normal">NORMAL</button>
                    <button id = "play-hard" class = "play-hard">HARD</button>
                </div>
                
                <div id = "game-over-screen" class = "game-over-screen">    
                    <h3 id = "gameOverText" class = "game-over-text"></h3>
                    <h2 id = "finalScore"></h2>
                    <button id = "restart" class = "restart">RESTART</button>
                </div> 
               
            </div>
            <div class = "controls">
                <div class = "control-buttons" id = "control-buttons">
                    <button id = "left"> LEFT </button>
                    <button id = "right"> RIGHT </button>
                </div>
                <p>OR USE</p>
                <img src = "../Images/keyboard_key_right.png">
            </div> 

        </div>
    </main>



    <footer>
        <hr style = "width: 30rem;">
        <h2>Join The ‎ <span>INV</span>ERT Community</h2>
        
        <ul>
            <li>
                <a href="#">
                <i class="fab fa-facebook-f icon"></i>    </a>
            </li>
            <li>
                <a href="#"><i class="fab fa-twitter icon"></i></a>
            </li>
            <li>
                <a href="#"><i class="fab fa-linkedin-in icon"></i></a></li>
            <li>
                <a href="#"><i class="fab fa-google-plus-g icon"></i></a></li>
        </ul>
        

        <p class = "copyright">©Copyright. Made by Zimmal Adnan. All Rights Reserved.</p>
    </footer>
</body>
</html>
