<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!--Favicon-->
    <link rel="icon" type="image/png" href="../Images/INVERT.png">

    <!--Reference to FontAwesome for icons-->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/4fc40ea9d1.js" crossorigin="anonymous"></script>

    <!--Reference to CSS files-->
    <link rel="stylesheet" href="../css-files/login.css">
    
    <!--Reference to JavaScript files for logic-->
    <script type = "text/javascript" src = "../login.js" defer></script>
    <script type = "text/javascript" src = "../index.js" defer></script>
</head>

<body>
    <!--Custom cursor for the website-->
    <div id = "cursor-dot" class = "cursor-dot"></div>
    <div id = "cursor-outline"class = "cursor-outline"></div>
    
    <!--Image behind the form-->
    <div class = "background-image">
        <img src = "../Images/black.png">
    </div>


    <main>
        <!--Black box on the left side for form-->
        <div class = "black-box">

            <!--Navigation to index page-->
            <a href = "index.html" class = "back-page">← Back To Home</a>
            
            <h1 class = "heading">LOGIN!</h1>

            <!--Login form and input fields-->
            <form id = "form" class = "form">

                <!--Feedback for errors or invalid credentials-->
                <h2 class = "feedback" id = "feedback"></h2>

                <!--Username input field-->
                <div class = "input-container">
                    <input id="username" name = "username" type="text" placeholder="Your name..." required>  
                    <label>ENTER USERNAME</label>
                </div>

                <!--Password input field-->
                <div class = "input-container">
                    <input type="password" id = "password" name = "password" placeholder="Your password..." required>
                    <label>ENTER PASSWORD</label>

                    <!--Eye icon to show/hide password-->
                    <div class="eye-toggle">
                        <i id="eye-icon" class="fas fa-eye"></i>
                        <i id="eye-slash" class="fas fa-eye-slash"></i>
                    </div>
                </div>

                <!--Remember Me checkbox-->
                <div class="remember-checkbox-container" id="remember-checkbox-container">      
                    <input type="checkbox" id="remember-checkbox" name="remember-checkbox">
                    <label for="remember-checkbox" class="remember-checkbox-label">REMEMBER ME</label>
                </div>

                <!--Submit login form button-->
                <button type="submit" id="submit-button" class="submit-button">
                    <span>LOGIN</span>

                    <!--Checkmark on submit button if form is valid-->
                    <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                        <path d="M20.285 2l-11.285 11.292-5.285-5.292-3.715 3.708 9 9.292 15-15.292z" />
                    </svg>
                    
                    <!--Cross on submit button if form is invalid-->
                    <svg class="cross" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                        <path d="M18.3 5.71L12 12l6.3 6.29-1.41 1.41L10.59 13.41 4.3 19.7 2.89 18.29 9.17 12 2.89 5.71 4.3 4.3 10.59 10.59 16.89 4.3z"/>
                    </svg>
                </button>

                <!--Navigation to signup page-->
                <a href = "signup.html" >Don't have an account? <span class = "sign-up">Sign up</span></a>
            </form>
        </div>

        <!--Translucent box on the right side for text-->
        <div class = "text-block">
            <div class = "translucent-box"></div>
            <div class = "text">
                <h1>ENTER THE INV<span style = "color: white;">ERT</span></h1>   
                <p>Join the Invert community and compete with players around the world!
                    Your journey starts with a single login.</p>           
            </div>
        </div>

    </main>
</body>
</html>
