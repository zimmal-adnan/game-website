<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/4fc40ea9d1.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../css-files/login.css">
    <link rel="icon" type="image/png" href="../Images/INVERT.png">
    <script src = "../login.js"></script>
    <script src = "../index.js"></script>
 
</head>
<body>
    <div id = "cursor-dot" class = "cursor-dot"></div>
    <div id = "cursor-outline"class = "cursor-outline"></div>
    <div class = "background-image">
        <img src = "../Images/black.png">
    </div>
    <main>
        <div class = "black-box">
            <a href = "index.html" class = "back-page">← Back To Home</a>
            <h1 class = "heading">LOGIN!</h1>
            <div class = "form">
                <div class = "input-container">
                    
                    <input placeholder="Your name..." />  
                    <label>ENTER USERNAME</label>
                </div>

                <div class = "input-container">
                    <input type = "password" id = "password" placeholder="Your password..." />
                    <label>ENTER PASSWORD</label>
                    <div class="eye-toggle">
                        <i id="eye-icon" class="fas fa-eye"></i>
                        <i id="eye-slash" class="fas fa-eye-slash"></i>
                    </div>
                </div>
                <button class = "username-button">LOGIN</button>
                <a href = "signup.html" >Don't have an account? <span class = "sign-up">Sign up</span></a>

            </div>
        </div>
        <div class = "text-block">
            <div class = "translucent-box"></div>
            <div class = "text">
                <h1>ENTER THE INV<span style = "color: white;">ERT</span></h1>   
                <p>Join the Invert community and compete with players around the world!
                    Your journey starts with a single login.</p>           
            </div>
        </div>

        

    </main>
</body>
</html>
